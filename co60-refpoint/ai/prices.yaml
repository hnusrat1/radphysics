# Cost model for the M4 estimate (STUDY_PLAN Section 5.4). Prices are OpenRouter's listed per-token prices for the
# models in ai/models.yaml (D030), in USD per million tokens, read from the public models endpoint. OpenRouter may
# route a call to an upstream whose price differs; the charge per call is recorded in ai/raw/ and summed by
# ai/harness/cost.py. tokens_per_conversation stays an assumption until the P0 pilot measures it.
checked_on: 2026-10-12
sources:
  - https://openrouter.ai/api/v1/models (pricing.prompt and pricing.completion, read 2026-10-12)
verified: true
prices:          # USD per million tokens
  frontier_anthropic: {input_per_mtok: 0.10, output_per_mtok: 0.50}     # anthropic/claude-haiku-5.5
  frontier_openai: {input_per_mtok: 0.10, output_per_mtok: 0.50}        # openai/gpt-6-luna
  frontier_google: {input_per_mtok: 0.10, output_per_mtok: 0.40}        # google/gemini-2.5-flash-lite
  open_weight_1: {input_per_mtok: 0.0173, output_per_mtok: 1.28}        # deepseek/deepseek-v4-flash
  open_weight_2: {input_per_mtok: 0.03, output_per_mtok: 0.13}          # qwen/qwen3.7-flash
  mock: {input_per_mtok: 0.0, output_per_mtok: 0.0}
tokens_per_conversation:   # assumed; output includes reasoning tokens; tool conditions re-send a growing context
  observables:
    A0: {input: 6000, output: 30000}
    A1: {input: 300000, output: 45000}
    A2: {input: 320000, output: 45000}
  events:
    A0: {input: 5000, output: 35000}
    A1: {input: 200000, output: 45000}
