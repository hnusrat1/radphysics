# Model slots for M4 (STUDY_PLAN Section 5.1; DECISIONS D028 item 5, D029).
# Access route: every slot goes through OpenRouter's OpenAI-compatible API with one key (OPENROUTER_API_KEY;
# Humza's choice, D029). model_id is the OpenRouter model name, filled in at launch: each provider's most capable
# generally available model (frontier slots) and two pinned open-weight releases from different labs. The model
# and upstream provider OpenRouter reports are recorded per call in ai/raw/. Set frozen: true once Humza has
# approved the list and the budget; the runner refuses R0 runs before that.
frozen: false
defaults: &openrouter
  api: openai_compatible
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
slots:
  - {slot: frontier_anthropic, provider: Anthropic via OpenRouter, <<: *openrouter, model_id: null,
     settings: {reasoning: {effort: high}}}
  - {slot: frontier_openai, provider: OpenAI via OpenRouter, <<: *openrouter, model_id: null,
     settings: {reasoning: {effort: high}}}
  - {slot: frontier_google, provider: Google via OpenRouter, <<: *openrouter, model_id: null,
     settings: {reasoning: {effort: high}}}
  - {slot: open_weight_1, provider: open-weight via OpenRouter (pinned weights), <<: *openrouter, model_id: null,
     settings: {reasoning: {effort: high}}}
  - {slot: open_weight_2, provider: open-weight via OpenRouter (pinned weights), <<: *openrouter, model_id: null,
     settings: {reasoning: {effort: high}}}
