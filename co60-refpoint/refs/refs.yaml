# Every external number used by the study.
#
# Rule (STUDY_PLAN Section 10.1): a value stays verified_by_humza: false until
# Humza checks it against the cited source. Code that reads a value from this
# file must not treat an unverified value as final.
#
# entered_from records how the value got here:
#   plan          stated in STUDY_PLAN.md
#   source_code   read from a pinned code release (file and line given)
#   recall        typed from memory of the cited source; the source itself was
#                 not reachable from the build environment. Check these first.
#   null value    not yet entered; source identified only.

