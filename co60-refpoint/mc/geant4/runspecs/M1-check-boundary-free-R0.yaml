run_id: M1-check-boundary-free-R0
purpose: >-
  Boundary-free dose at R0. The main run's variance reduction (importance cells, roulette) with the scoring cylinder
  moved to 8 cm, far from R0, and the depth scan restricted to the R0 volume (r < 1 cm, 4.9-5.1 cm, two 1 mm bins).
  No geometric boundary lies within an electron range of R0, so the position-scored dose there is free of the
  boundary artifact seen in M1-R0-option4-pdd. Its ratio to the main run's volume-scored D bounds the effect of the
  scoring cylinder's boundary on D at R0. The ROI is extended to 8.9 cm so that the moved cylinder is covered.
physics: option4
threads: 4
batches: 10
histories_per_batch: 6000000
seed_base: 6261
geometry: {scoring_radius_cm: 1.0, scoring_thickness_cm: 0.2, scoring_depth_cm: 8.0}
source: {ssd_cm: 100.0, field_cm: [10.0, 10.0]}
cuts: {electron_threshold_keV: 10, gamma_threshold_keV: 10}
russian_roulette: {enabled: true, survival: 0.05, roi_cm: [1.8, 4.1, 8.9]}
importance_cells_cm:   # as M1-R0-option4
  - [8.0, -1.0, 14.0, 2]
  - [4.0, 2.0, 8.0, 8]
  - [2.5, 3.4, 6.6, 32]
pre_init_commands: ['/process/em/UseGeneralProcess false']   # DECISIONS D019
depth_scan: true
depth_bins: {min: 4.9, max: 5.1, n: 2, radius: 1.0}
event_sample_per_batch: 0
