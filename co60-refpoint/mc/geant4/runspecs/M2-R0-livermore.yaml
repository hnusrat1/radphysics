run_id: M2-R0-livermore
purpose: >-
  M2 physics-list comparison at R0 (STUDY_PLAN Section 4.1): G4EmLivermorePhysics with everything else as
  M2-R0-option4 (frozen production binary, scoring cylinder, thresholds, variance reduction, msc range factor
  0.04, general gamma process off). Differences from option4 measure the EM model spread at fixed transport
  settings (DECISIONS D028). At least 20 batches (D026).
physics: livermore
threads: 4
batches: 20
histories_per_batch: 6000000
seed_base: 7101
geometry: {scoring_radius_cm: 1.0, scoring_thickness_cm: 0.2, scoring_depth_cm: 5.0}
source: {ssd_cm: 100.0, field_cm: [10.0, 10.0]}
cuts: {electron_threshold_keV: 10, gamma_threshold_keV: 10}
russian_roulette: {enabled: true, survival: 0.05, roi_cm: [1.8, 4.1, 5.9]}
importance_cells_cm:   # as M1-R0-option4
  - [8.0, -1.0, 14.0, 2]
  - [4.0, 2.0, 8.0, 8]
  - [2.5, 3.4, 6.6, 32]
pre_init_commands: ['/process/em/UseGeneralProcess false', '/process/msc/RangeFactor 0.04']   # D019; D026/D028 (M2 stepping)
depth_scan: false
event_sample_per_batch: 5000
