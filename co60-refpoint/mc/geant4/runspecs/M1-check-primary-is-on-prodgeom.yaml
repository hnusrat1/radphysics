run_id: M1-check-primary-is-on-prodgeom
purpose: >-
  Diagnostic for the primary-fluence deficit at R0 (measured/analytic 0.9985 +- 0.0003 in M1-R0-option4).
  Photon transport only: /process/em/lowestElectronEnergy 2 MeV stops every electron in its first step, which
  leaves photon transport unchanged. Production scoring cylinder (r 1 cm, t 0.2 cm at 5 cm depth): the mass boundaries inside the innermost importance cell are those of M1-R0-option4.
  Importance sampling on with the production cells; Russian roulette off. Compare the primary track-length fluence with the
  analytic value; on and off together separate a variance-reduction bias from a physics or analytic cause.
physics: option4
threads: 4
batches: 8
histories_per_batch: 5000000
seed_base: 6221
geometry: {scoring_radius_cm: 1.0, scoring_thickness_cm: 0.2, scoring_depth_cm: 5.0}
source: {ssd_cm: 100.0, field_cm: [10.0, 10.0]}
cuts: {electron_threshold_keV: 10, gamma_threshold_keV: 10}
russian_roulette: {enabled: false, roi_cm: [1.8, 4.1, 5.9]}
importance_cells_cm:   # production cells (M1-R0-option4)
  - [8.0, -1.0, 14.0, 2]
  - [4.0, 2.0, 8.0, 8]
  - [2.5, 3.4, 6.6, 32]
pre_init_commands: ['/process/em/UseGeneralProcess false', '/process/em/lowestElectronEnergy 2 MeV']
depth_scan: false
event_sample_per_batch: 0
