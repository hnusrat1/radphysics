run_id: M1-R0-option4-pdd
purpose: >-
  Central-axis depth scan for PDD(5) (STUDY_PLAN Layer 5): 1 mm slabs from the surface to 10 cm within r < 1 cm.
  The electron Russian-roulette ROI covers the whole scanned column plus the range buffer; photon importance
  sampling favours the column.
physics: option4
threads: 4
batches: 10
histories_per_batch: 6000000
seed_base: 6105
geometry: {scoring_radius_cm: 1.0, scoring_thickness_cm: 0.2, scoring_depth_cm: 5.0}
source: {ssd_cm: 100.0, field_cm: [10.0, 10.0]}
cuts: {electron_threshold_keV: 10, gamma_threshold_keV: 10}
russian_roulette: {enabled: true, survival: 0.05, roi_cm: [1.8, -1.0, 10.8]}
importance_cells_cm:
  - [8.0, -1.0, 16.0, 2]
  - [3.0, -1.0, 11.6, 8]
depth_scan: true
event_sample_per_batch: 0
