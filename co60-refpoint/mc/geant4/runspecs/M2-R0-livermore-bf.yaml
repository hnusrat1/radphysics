run_id: M2-R0-livermore-bf
purpose: >-
  Boundary-free dose at R0 for G4EmLivermorePhysics (DECISIONS D025): as M1-check-boundary-free-R0 (scoring cylinder moved to 8 cm, dose scored by position in r < 1 cm, 4.9-5.1 cm) with the Livermore list. Its ratio to M2-R0-livermore checks the boundary effect for this list.
physics: livermore
threads: 4
batches: 20
histories_per_batch: 3000000
seed_base: 7111
geometry: {scoring_radius_cm: 1.0, scoring_thickness_cm: 0.2, scoring_depth_cm: 8.0}
source: {ssd_cm: 100.0, field_cm: [10.0, 10.0]}
cuts: {electron_threshold_keV: 10, gamma_threshold_keV: 10}
russian_roulette: {enabled: true, survival: 0.05, roi_cm: [1.8, 4.1, 8.9]}
importance_cells_cm:   # as M1-R0-option4
  - [8.0, -1.0, 14.0, 2]
  - [4.0, 2.0, 8.0, 8]
  - [2.5, 3.4, 6.6, 32]
pre_init_commands: ['/process/em/UseGeneralProcess false']   # DECISIONS D019
depth_scan: true
depth_bins: {min: 4.9, max: 5.1, n: 2, radius: 1.0}
event_sample_per_batch: 0
