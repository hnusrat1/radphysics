run_id: M2-R0-option4
purpose: >-
  M2 production at R0 (DECISIONS D026, D028): all five layers with G4EmStandardPhysics_option4 and the M2 stepping
  (msc range factor 0.04), otherwise as M1-R0-option4 (thresholds, variance reduction, event sample). This is the
  reference for the AI comparison; M1-R0-option4 (range factor 0.08) measures the step-size sensitivity of every
  observable. Dose at R0 from M2-R0-option4-bf (boundary-free, D025).
physics: option4
threads: 4
batches: 20
histories_per_batch: 6000000
seed_base: 7001
geometry: {scoring_radius_cm: 1.0, scoring_thickness_cm: 0.2, scoring_depth_cm: 5.0}
source: {ssd_cm: 100.0, field_cm: [10.0, 10.0]}
cuts: {electron_threshold_keV: 10, gamma_threshold_keV: 10}
russian_roulette: {enabled: true, survival: 0.05, roi_cm: [1.8, 4.1, 5.9]}
importance_cells_cm:   # radius, zmin, zmax, importance; outermost first
  - [8.0, -1.0, 14.0, 2]
  - [4.0, 2.0, 8.0, 8]
  - [2.5, 3.4, 6.6, 32]
pre_init_commands: ['/process/em/UseGeneralProcess false', '/process/msc/RangeFactor 0.04']   # D019; D026/D028 (M2 stepping)
depth_scan: false
event_sample_per_batch: 10000
