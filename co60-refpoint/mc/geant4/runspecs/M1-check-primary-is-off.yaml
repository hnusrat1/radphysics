run_id: M1-check-primary-is-off
purpose: >-
  Diagnostic for the primary-fluence deficit at R0 (measured/analytic 0.9985 +- 0.0003 in M1-R0-option4).
  Photon transport only: /process/em/lowestElectronEnergy 2 MeV stops every electron in its first step, which
  leaves photon transport unchanged. Larger scoring cylinder (r 4 cm, t 1 cm at 5 cm depth) for statistics.
  Importance sampling off; Russian roulette off. Compare the primary track-length fluence with the
  analytic value; on and off together separate a variance-reduction bias from a physics or analytic cause.
physics: option4
threads: 4
batches: 8
histories_per_batch: 2500000
seed_base: 6201
geometry: {scoring_radius_cm: 4.0, scoring_thickness_cm: 1.0, scoring_depth_cm: 5.0}
source: {ssd_cm: 100.0, field_cm: [10.0, 10.0]}
cuts: {electron_threshold_keV: 10, gamma_threshold_keV: 10}
russian_roulette: {enabled: false, roi_cm: [5.0, 3.5, 6.5]}
pre_init_commands: ['/process/em/UseGeneralProcess false', '/process/em/lowestElectronEnergy 2 MeV']
depth_scan: false
event_sample_per_batch: 0
