run_id: M1-vrcheck-analog
purpose: >-
  Variance-reduction check (DECISIONS D016): R0 with option4 and no variance reduction, to compare with
  M1-R0-option4 (electron Russian roulette and photon importance sampling). Both techniques are unbiased by
  construction; this run tests the implementation.
physics: option4
threads: 4
batches: 10
histories_per_batch: 6000000
seed_base: 6102
geometry: {scoring_radius_cm: 1.0, scoring_thickness_cm: 0.2, scoring_depth_cm: 5.0}
source: {ssd_cm: 100.0, field_cm: [10.0, 10.0]}
cuts: {electron_threshold_keV: 10, gamma_threshold_keV: 10}
russian_roulette: {enabled: false}
pre_init_commands: ['/process/em/UseGeneralProcess false']   # DECISIONS D019
depth_scan: false
event_sample_per_batch: 0
