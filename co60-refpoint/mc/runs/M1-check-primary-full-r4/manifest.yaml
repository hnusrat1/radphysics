run_id: M1-check-primary-full-r4
purpose: Diagnostic for the primary-fluence deficit at R0. Full electron transport, no variance reduction,
  in the geometry of M1-check-primary-is-off (scoring cylinder r 4 cm, t 1 cm at 5 cm depth). The two
  runs differ only in /process/em/lowestElectronEnergy 2 MeV (photon-only) versus full transport, so a
  difference in primary fluence isolates an effect of electron transport on the photon bookkeeping.
