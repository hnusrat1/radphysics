run_id: M1-check-primary-ismass-prodgeom
purpose: 'Diagnostic for the primary-fluence deficit at R0 (measured/analytic 0.9985 +- 0.0003 in M1-R0-option4).
  Photon transport only: /process/em/lowestElectronEnergy 2 MeV stops every electron in its first step,
  which leaves photon transport unchanged. Production scoring cylinder (r 1 cm, t 0.2 cm at 5 cm depth):
  the mass boundaries inside the innermost importance cell are those of M1-R0-option4. Importance sampling
  with the production cells as mass-geometry water volumes (importance_geometry: mass, DECISIONS D021
  candidate); Russian roulette off. Compare the primary track-length fluence with the analytic value;
  on and off together separate a variance-reduction bias from a physics or analytic cause.'
