spec:
  run_id: M2-R0-livermore
  purpose: 'M2 physics-list comparison at R0 (STUDY_PLAN Section 4.1): G4EmLivermorePhysics with everything
    else as M2-R0-option4 (frozen production binary, scoring cylinder, thresholds, variance reduction,
    msc range factor 0.04, general gamma process off). Differences from option4 measure the EM model spread
    at fixed transport settings (DECISIONS D028). At least 20 batches (D026).'
