    - 8.0
    - 8
  - - 2.5
    - 3.4
    - 6.6
    - 32
  pre_init_commands:
  - /process/em/UseGeneralProcess false
  - /process/msc/RangeFactor 0.04
  depth_scan: false
  event_sample_per_batch: 5000
