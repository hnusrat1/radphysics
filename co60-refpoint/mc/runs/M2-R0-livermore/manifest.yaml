    field_cm:
    - 10.0
    - 10.0
  cuts:
    electron_threshold_keV: 10
    gamma_threshold_keV: 10
  russian_roulette:
    enabled: true
    survival: 0.05
    roi_cm:
    - 1.8
    - 4.1
    - 5.9
  importance_cells_cm:
