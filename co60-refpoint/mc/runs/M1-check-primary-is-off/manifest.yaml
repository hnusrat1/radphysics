run_id: M1-check-primary-is-off
purpose: 'Diagnostic for the primary-fluence deficit at R0 (measured/analytic 0.9985 +- 0.0003 in M1-R0-option4).
  Photon transport only: /process/em/lowestElectronEnergy 2 MeV stops every electron in its first step,
  which leaves photon transport unchanged. Larger scoring cylinder (r 4 cm, t 1 cm at 5 cm depth) for
  statistics. Importance sampling off; Russian roulette off. Compare the primary track-length fluence
  with the analytic value; on and off together separate a variance-reduction bias from a physics or analytic
  cause.'
