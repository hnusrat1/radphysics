spec:
  run_id: M2-R0-option4
  purpose: 'M2 production at R0 (DECISIONS D026, D028): all five layers with G4EmStandardPhysics_option4
    and the M2 stepping (msc range factor 0.04), otherwise as M1-R0-option4 (thresholds, variance reduction,
