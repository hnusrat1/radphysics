run_id: M1-check-boundary-free-R0-ext
purpose: 'Extension approved at the M1 gate (DECISIONS D025): same spec, new seeds, 20 more batches, pooled
  with M1-check-boundary-free-R0 to bound the boundary effect on D at R0 to about 0.1%. Boundary-free
  dose at R0. The main run''s variance reduction (importance cells, roulette) with the scoring cylinder
  moved to 8 cm, far from R0, and the depth scan restricted to the R0 volume (r < 1 cm, 4.9-5.1 cm, two
  1 mm bins). No geometric boundary lies within an electron range of R0, so the position-scored dose there
  is free of the boundary artifact seen in M1-R0-option4-pdd. Its ratio to the main run''s volume-scored
  D bounds the effect of the scoring cylinder''s boundary on D at R0. The ROI is extended to 8.9 cm so
  that the moved cylinder is covered.'
