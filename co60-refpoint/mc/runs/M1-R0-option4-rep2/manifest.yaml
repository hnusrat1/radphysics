    - 14.0
    - 2
  - - 4.0
    - 2.0
    - 8.0
    - 8
  - - 2.5
    - 3.4
    - 6.6
    - 32
  pre_init_commands:
  - /process/em/UseGeneralProcess false
  depth_scan: false
  event_sample_per_batch: 10000
