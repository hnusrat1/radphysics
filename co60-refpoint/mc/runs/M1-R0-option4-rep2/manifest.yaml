spec:
  run_id: M1-R0-option4-rep2
  purpose: 'Seed-independent replicate of M1-R0-option4 (identical spec and production binary, seed_base
    6111): tests whether its primary-fluence deficit (measured/analytic 0.9985 +- 0.0003) reproduces.
    M1 production at R0 (STUDY_PLAN Section 2) with G4EmStandardPhysics_option4: all five layers, production
    thresholds 10 keV (e-, e+) in the whole phantom, event sample. Variance reduction (DECISIONS D016):
    Russian roulette of electrons born outside the ROI and photon importance sampling, both unbiased.'
  physics: option4
  threads: 4
  batches: 10
  histories_per_batch: 12000000
  seed_base: 6111
  geometry:
    scoring_radius_cm: 1.0
    scoring_thickness_cm: 0.2
    scoring_depth_cm: 5.0
  source:
    ssd_cm: 100.0
    field_cm:
    - 10.0
    - 10.0
  cuts:
    electron_threshold_keV: 10
    gamma_threshold_keV: 10
  russian_roulette:
    enabled: true
    survival: 0.05
    roi_cm:
    - 1.8
    - 4.1
    - 5.9
  importance_cells_cm:
