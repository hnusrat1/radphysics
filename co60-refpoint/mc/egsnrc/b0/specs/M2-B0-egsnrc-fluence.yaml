run_id: M2-B0-egsnrc-fluence
purpose: >-
  EGSnrc B0 benchmark, fluence spectra (STUDY_PLAN Section 4.2): FLURZnrc, same geometry and source as
  M2-B0-egsnrc-dose; photon (total and first-generation) and electron fluence spectra in r < 1 cm, 4.9-5.1 cm,
  10 keV bins. Compared with M2-B0-option4. The first-generation photon fluence checks the normalization against
  the analytic primary fluence.
code: flurznrc
pegs4_file: water_air_g4_option4
media: [H2O_G4, AIR_G4]
geometry: {planes_cm: [0.0, 4.9, 5.1, 30.0], radii_cm: [1.0, 15.0]}
source: {ssd_cm: 100.0, field_radius_cm: 5.64, spectrum_file: co60_lines.spectrum}
scoring_region: 3
bin_width_MeV: 0.01
parallel: 4
jobs: 8
histories_per_job: 60000000
seed_base: 2101
