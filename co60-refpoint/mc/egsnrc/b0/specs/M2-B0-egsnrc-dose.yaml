run_id: M2-B0-egsnrc-dose
purpose: >-
  EGSnrc B0 benchmark, dose (STUDY_PLAN Section 4.2): DOSRZnrc, point source at 100 cm, circular field r 5.64 cm,
  cylindrical water phantom r 15 cm x 30 cm, matched water (D015), dose in r < 1 cm, 4.9-5.1 cm. Analog transport,
  EXACT boundary crossing, 10 keV cutoffs. Output is dose per unit fluence at the front face on axis; D/Phi0 =
  output x (105/100)^2. Compared with the boundary-free Geant4 B0 dose (M2-B0-option4-bf).
code: dosrznrc
pegs4_file: water_air_g4_option4
media: [H2O_G4, AIR_G4]
geometry: {planes_cm: [0.0, 4.9, 5.1, 30.0], radii_cm: [1.0, 15.0]}
source: {ssd_cm: 100.0, field_radius_cm: 5.64, spectrum_file: co60_lines.spectrum}
scoring_region: 3
bin_width_MeV: 0.01
parallel: 4
jobs: 16
histories_per_job: 80000000
seed_base: 2001
