# Prose for the M1 results page (analysis/m1_report.py). Numbers on the page come from
# analysis/results/M1_results.json and analysis/M1_fano_summary.yaml; the few numbers
# quoted here are cross-checked against those files or against the run outputs named.
date: 10 October 2026

intro: >-
  Monte Carlo reference for the photon-to-dose chain at R0: Co-60 point source (1.1732 and 1.3325 MeV, equal
  weights), 10 × 10 cm² at SSD 100 cm, scoring cylinder r = 1 cm, t = 0.2 cm centred at 5 cm depth in water.
  Geant4 11.4.3 with G4EmStandardPhysics_option4, 10 keV production thresholds. Every value is a mean over
  independent batches with the standard error of that mean. These are the numbers the AI answers will be
  scored against in M3–M4; nothing here has been shown to a model.

bases:
  icru37: "ICRU 37 basis (Bethe–Møller, I = 75 eV)"
  icru90: "ICRU 90 basis (Bethe–Møller, I = 78 eV)"
  geant4: "Geant4 option4 stopping powers"
  pegs4: "EGSnrc PEGS4, media matched to Geant4"

layer1: >-
  Photon fluence in the scoring volume, split by history: primary (never interacted), scattered source photons,
  and secondary photons (bremsstrahlung, fluorescence, annihilation). Track-length estimator, normalised to the
  in-air primary fluence Φ₀ at the point (1/(Ω R²) with R = 105 cm).

layer2: >-
  Which interactions happen in the scoring volume, by process, and where the energy transferred to charged
  particles comes from. Rayleigh scattering is included: Geant4's general gamma process omits it above
  1.022 MeV, so it was switched off (DECISIONS D019).

layer3: >-
  Kinetic energies of the electrons and positrons set in motion in the scoring volume, by producing process and
  by whether the parent photon was primary or scattered.

layer4: >-
  Electron fluence spectrum in the scoring volume (all generations), from the CSDA-weighted track-length
  estimator (DECISIONS D020); the plan's linear estimator is reported alongside. Delta rays above 10 keV are
  shown separately.

layer5: >-
  Absorbed dose, kerma and collision kerma per unit Φ₀, β = D/K<sub>col</sub>, and the Spencer–Attix
  water-to-air stopping-power ratio (Δ = 10 keV, Nahum track-end term) from the scored electron fluence,
  on four stopping-power bases.

pdd_note: >-
  Dose maximum and PDD(5) come from a separate run with a central-axis depth scan (M1-R0-option4-pdd). The bump
  at 4.5–4.8 cm and the dip at 5.2–5.6 cm are a transport artifact of the scoring cylinder's boundary at
  4.9 and 5.1 cm; it moves with the cylinder and does not show inside it (see Findings).

checks_intro: >-
  Statistical targets from STUDY_PLAN Section 4.1 and the validation checks. Every row is computed from the
  run outputs.

fano: >-
  Fano cavity test of the electron transport settings used in production (fanoCavity example, same msc and
  step parameters). The opt0 run is a negative control that should fail.

findings:
  - title: "The s_w,air basis matters more than the statistics"
    warn: true
    body: >-
      The same Monte Carlo electron spectrum gives s<sub>w,air</sub> = 1.1331 with ICRU 37 stopping powers,
      1.1268 with ICRU 90 and 1.1385 with Geant4's own. That is a 1% spread, against a statistical uncertainty
      below 10<sup>−5</sup>. Geant4 option4 uses the Penelope ionisation model below 100 keV; for water its
      collision stopping power is 2.5% above Bethe–Møller (I = 78 eV) at 12 keV and 1.7% at 100 keV, smoothed
      into the higher-energy model above that. Air agrees within 0.1%. Which basis the AI answers are scored
      against is a gate decision.
  - title: "Geant4's general gamma process drops Rayleigh scattering above 1.022 MeV"
    warn: false
    body: >-
      In option4 (Geant4 11.4.3) G4GammaGeneralProcess does not sample coherent scattering in its 2m<sub>e</sub>c²–100 MeV
      zone, which contains both Co-60 lines. It showed up as zero Rayleigh events among primary photons in the
      first production attempt. That run was archived and all production runs switch the general process off
      (DECISIONS D019).
  - title: "The plan's linear electron-fluence estimator fails closure"
    warn: false
    body: >-
      Spreading each step's track length linearly over its energy loss puts too much fluence at low energy when
      Geant4 ends an electron in one step: the dose rebuilt from that fluence is 6.4% too high. Spreading it as
      1/L(E) closes to 0.06%. Layer 4 uses the CSDA-weighted estimator; the linear one is reported alongside
      (DECISIONS D020). On s<sub>w,air</sub> the two differ by 0.008%.
  - title: "The scoring cylinder's boundary distorts the dose next to it"
    warn: true
    body: >-
      The depth scan shows the dose 2–3.7% high just in front of the scoring cylinder and 1.5–2.3% low just
      behind it, in water on both sides. Moving the cylinder to 8 cm moves the pattern. Far from both
      cylinders the two depth scans agree to 0.1%. Inside the cylinder the dose is 0.24% below the boundary-free
      dose at the same depth (−2.2σ; row in the checks table, from 30 batches with the main run's variance
      reduction and the cylinder moved to 8 cm, plus 4 analog batches at about 1% weight), so the boundary-free value is now the R0 dose reference
      (DECISIONS D025, D027). The likely cause is the electron step limit near boundaries (GS multiple
      scattering, SafetyPlus), which moves energy deposition without creating any. From M2 the dose at R0 is
      scored without a boundary nearby.
  - title: "A primary-fluence fluctuation that looked like a 4σ effect"
    warn: false
    body: >-
      The main run's primary fluence came out 0.12% below the analytic value, and its batch spread made that look
      like 4σ. Eight diagnostic runs and a transmission measurement of μ found no cause. The main run's batches
      agreed with each other better than their history variance allows, so its error bar was too small (DECISIONS
      D023). A replicate with new seeds, pooled by a rule fixed before it finished (D022), came out normal; the
      pooled value is in the checks table.
  - title: "Ten-batch error bars can be too small"
    warn: false
    body: >-
      The standard error from 10 batches is itself uncertain by about ±24%, and in the main run it came out 0.4–0.7
      of the history-by-history value. Reported uncertainties are now the larger of the two where both exist
      (DECISIONS D023), and the statistical targets are checked against that larger error.

decisions:
  - title: "s_w,air scoring reference (D024)"
    body: "ICRU 90 basis primary, ICRU 37 reported alongside; fixed before any AI answer exists."
  - title: "Scoring-volume boundary (D025)"
    body: "The 20-batch extension resolved the effect (cylinder 0.24% low, −2.2σ); the boundary-free D is the R0 reference (D027, 2σ threshold to confirm). From M2, dose at R0 is scored by position with no boundary nearby."
  - title: "Uncertainty policy (D023)"
    body: "Approved: the larger of the batch and history-by-history standard errors."
  - title: "Layer 4 estimator (D020)"
    body: "Approved: CSDA-weighted spectrum as the reference, linear estimator reported alongside."
  - title: "Fano and M2 settings (D026)"
    body: "+0.16% accepted as a bound. Range factor 0.04 gives 1.0000 ± 0.0009, so the deviation disappears with tighter stepping; M2 plans range factor 0.04 pending the step-function result. M2 runs use at least 20 batches."
  - title: "refs.yaml (D026)"
    body: "Humza verifies line energies, TRS-398 s_w,air, I-values and normalisation constants first, and adds a published PDD(5)."

footer: >-
  Co-60 reference point study, milestone M1. Generated by analysis/m1_report.py from analysis/results/M1_results.json.
